{% extends "base.html" %}
{% block title %}BookHub - Registro{% endblock %}

{% block content %}
<div class="auth-page">
    <section class="auth-brand">
        <h1>BookHub</h1>
        <p>Únete a la comunidad de lectores.</p>
    </section>

    <div class="auth-card">
        <h2>Crear Cuenta</h2>

        <form method="POST">
            <label for="first_name">Nombre</label>
            <input id="first_name" name="first_name" minlength="2" required>

            <label for="last_name">Apellido</label>
            <input id="last_name" name="last_name" minlength="2" required>

            <label for="email">E-mail</label>
            <input id="email" type="email" name="email" required>

            <label for="password">Contraseña</label>
            <input id="password" type="password" name="password" minlength="8" required>

            <label for="confirm_password">Confirmar Contraseña</label>
            <input id="confirm_password" type="password" name="confirm_password" minlength="8" required>

            <button class="primary-button" type="submit">Registrarse</button>
        </form>

        <p class="auth-link">
            ¿Ya tienes cuenta?
            <a href="{{ url_for('auth.login') }}">Inicia sesión</a>
        </p>
    </div>
</div>
{% endblock %}

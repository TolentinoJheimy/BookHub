{% extends "base.html" %}
{% block title %}BookHub - Iniciar sesión{% endblock %}

{% block content %}
<div class="auth-page">
    <section class="auth-brand">
        <h1>BookHub</h1>
        <p>Comparte, descubre y comenta libros.</p>
    </section>

    <div class="auth-card">
        <h2>Iniciar Sesión</h2>

        <form method="POST">
            <label for="email">E-mail</label>
            <input id="email" type="email" name="email" required>

            <label for="password">Contraseña</label>
            <input id="password" type="password" name="password" required>

            <button class="primary-button" type="submit">Iniciar Sesión</button>
        </form>

        <p class="auth-link">
            ¿No tienes cuenta?
            <a href="{{ url_for('auth.register') }}">Regístrate</a>
        </p>
    </div>
</div>
{% endblock %}
